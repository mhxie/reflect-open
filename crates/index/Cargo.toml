[package]
name = "reflect-index"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The SQLite index of a graph: the note projection writer, the read-only query bridge, the reconcile scan, chat history and embedding rows, behind one generation-gated session."

[dependencies]
# `hooks` adds the authorizer API that locks the read-only `db_query` bridge
# down to pure reads (deny ATTACH/DETACH/PRAGMA); see `query.rs`.
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1.44"
sha2 = { workspace = true }
reflect-types = { workspace = true, features = ["rusqlite"] }
# Local-only rows are private whatever their projection says.
reflect-graph-paths = { workspace = true }
# The schema's keys and the CJK search text the FTS columns hold. The
# file-backed connections (`FileIndexConnections`) also need its openers; a
# host that owns its own connection can turn the `native` feature off.
reflect-index-schema = { path = "../index-schema", default-features = false }

[features]
default = ["native"]
native = ["reflect-index-schema/vec"]

[dev-dependencies]
tempfile = { workspace = true }
reflect-index-schema = { path = "../index-schema" }
