[package]
name = "reflect-types"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The wire types every Rust crate and the TypeScript frontend share: the error contract, file metadata, file-change batches, and event names."

[dependencies]
serde = { workspace = true }
# Error conversions for the crates that own these dependencies. Each stays
# optional so a host without libgit2 or SQLite (a wasm build) never links them.
git2 = { version = "0.21.0", default-features = false, optional = true }
rusqlite = { workspace = true, optional = true }

# ELOOP: a refused no-follow open classifies as a traversal.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[features]
git2 = ["dep:git2"]
rusqlite = ["dep:rusqlite"]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
