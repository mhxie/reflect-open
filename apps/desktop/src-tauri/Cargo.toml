[package]
name = "reflect-open"
# Intentionally frozen: the app version lives in apps/desktop/package.json and
# tauri.conf.json points at it. The crate is never published, so its version
# has no consumer — freezing it keeps Cargo.lock out of every release diff.
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reflect_open_lib"
# `staticlib` links into the iOS app as `libapp.a`; `rlib` serves the desktop
# binary. There is no Android target, so no `cdylib`.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
infer = "0.19"
http-range-header = "0.4"

# `devtools` compiles the web inspector into release builds too (it is otherwise
# debug-only), so a shipped app stays debuggable — see `src/devtools.rs`.
tauri = { workspace = true, features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2.7.0"
# Decodes `reflect-asset://` request paths (`fs/asset_protocol.rs`); the same
# crate tauri itself uses for its protocol URLs.
percent-encoding = "2.3.2"
# `time` backs the bounded wait in `windows::close_note_windows` (tauri
# already runs on tokio; this only makes the sleep primitive addressable).
tokio = { version = "1.53.1", features = ["time", "sync", "fs", "io-util", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
# `hooks` adds the authorizer API used to lock the read-only `db_query` bridge
# down to pure reads (deny ATTACH/DETACH/PRAGMA); see `db/query.rs`.
rusqlite = { workspace = true, features = ["hooks"] }
reflect-index-schema = { path = "../../../crates/index-schema" }
reflect-graph-paths = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.1"
base64 = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring-core = "1.0.0"
# Git backup/sync primitives (Plan 12) + SSH transport for generic remotes
# (Plan 16 V1: agent auth only). Everything is vendored/static — libssh2 and
# openssl must never link against homebrew dylibs the distributed app won't
# have (libssh2-sys only consults pkg-config when LIBSSH2_SYS_USE_PKG_CONFIG
# is set, and vendored-openssl pins the rest).
git2 = { version = "0.21.0", default-features = false, features = [
  "https",
  "ssh",
  "vendored-libgit2",
  "vendored-openssl",
] }
# unsafe-headers lets provider-fetch.ts pass an explicit empty Origin, which
# the plugin treats as "send no Origin header" (see providerFetch's doc).
tauri-plugin-http = { version = "2.8.0", features = ["unsafe-headers"] }
# Link capture (Plan 11): screenshot downscale + the bounded meta-scrape fetch.
# reqwest 0.12 rides the exact version tauri-plugin-http already compiles.
image = { version = "0.25.10", default-features = false, features = [
  "gif",
  "ico",
  "jpeg",
  "png",
  "webp",
] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
# Reflect V1 exports are zip archives of the graph-folder layout. Keep the
# reader lean: stored entries plus the usual deflate method are enough here.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The watcher (desktop) and the Git merge's local-only check (every target).
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# Apple Calendar read-only bridge (`src/calendar.rs`): EventKit through the
# objc2 bindings, trimmed to the classes the modules touch. objc2-app-kit
# backs EKCalendar's NSColor → hex conversion and the Edit menu's Paste and
# Match Style item (`src/menu.rs`); NSProcessInfo backs the App Nap
# activities in `src/activity.rs`.
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSError",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSProcessInfo",
  "NSString",
  "NSUUID",
  "NSValue",
  "block2",
] }
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "EKCalendar",
  "EKCalendarItem",
  "EKEvent",
  "EKEventStore",
  "EKObject",
  "EKParticipant",
  "EKSource",
  "EKTypes",
  "block2",
  "objc2-app-kit",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSColor",
  "NSColorSpace",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSWorkspace",
] }
# On-device audio-memo transcription (`src/local_transcription/`): whisper.cpp
# on Metal, fed by AudioToolbox's ExtAudioFile (m4a/AAC, WAV), which resamples
# to the model's 16 kHz in the same pass.
whisper-rs = { version = "0.16.0", features = ["metal", "tracing_backend"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
  "std",
  "AudioFile",
  "ExtendedAudioFile",
  "objc2-core-audio-types",
  "objc2-core-foundation",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
  "std",
  "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFURL",
] }
# Meeting capture (`src/meeting_capture/`): a Core Audio process tap and
# private aggregate device record the microphone and system audio on one
# clock (macOS 14.2+); rtrb carries frames off the realtime IO thread;
# realfft runs the echo suppressor's STFT; the global
# shortcut starts and stops a recording from whichever app has focus.
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
  "std",
  "AudioHardware",
  "block2",
  "dispatch2",
  "objc2",
  "objc2-core-audio-types",
  "objc2-foundation",
] }
realfft = "3.5.0"
rtrb = "0.4.0"
# Qwen3-ASR (`src/local_transcription/qwen.rs`), the second on-device model
# family: candle on Metal, no Python. Its own Hugging Face loader is left off;
# downloads go through hf-hub like whisper's.
qwen3-asr = { version = "0.2.2", default-features = false, features = ["metal"] }
tauri-plugin-global-shortcut = "2.3.1"
# WebKit's MediaRecorder writes WebM/Opus, which AudioToolbox can't open:
# symphonia demuxes it and libopus (built from source) decodes straight to 16 kHz.
symphonia = { version = "0.6.1", default-features = false, features = ["mkv"] }
symphonia-adapter-libopus = "0.3.0"

# Apple Contacts integration (`contacts.rs`): live CNContactStore lookups on
# macOS and iOS — never a mirrored copy of the address book. block2 bridges the
# requestAccessForEntityType completion handler back into blocking Rust.
# core-foundation backs the iCloud/backup sync-exclusion resource keys on
# `.reflect/` and `.git/` (`fs/io.rs`), which matter on both Apple targets.
# dispatch2 supplies MainThreadBound, keeping the iCloud metadata query's
# non-Send Objective-C handles pinned to the main thread (`icloud/watch.rs`).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = "0.10.1"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-contacts = "0.3.2"
objc2-link-presentation = { version = "0.3.2", default-features = false, features = [
  "std",
  "LPLinkMetadata",
  "LPMetadataProvider",
  "block2",
] }
block2 = "0.6.2"

# Finite-length execution assertions around iOS persistence. UIKit's begin/end
# methods keep file and SQLite locks from surviving process suspension.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "UIApplication",
  "block2",
] }
tauri-plugin-iap = "0.9.1"
tauri-plugin-app-store = { path = "../../../plugins/tauri-plugin-app-store" }
tauri-plugin-web-auth = { path = "../../../plugins/tauri-plugin-web-auth" }
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

# Desktop-only capabilities (Plan 19): auto-update (mobile updates go through
# the app stores), window-state (no windows to restore on mobile), the file
# watcher (nothing else writes the mobile sandbox; local writes notify
# in-process), the embedding runtime (fastembed/ORT is not built for mobile —
# semantic search is desktop-only in the first mobile wave), and OS-trash
# deletes (mobile moves into the graph-local `.reflect/trash/` instead).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-window-state = "2.5.0"
trash = "5.2.8"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# The watcher's pruned file-ID cache (rename stitching without the full-tree
# walk) reuses the debouncer's own building blocks directly.
file-id = "0.2.3"
# Direct dependency on fastembed's own downloader, used to pre-fetch the
# embedding model with byte-level progress (fastembed downloads silently).
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "native-tls"] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }

[target.'cfg(all(not(any(target_os = "android", target_os = "ios")), not(all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
fastembed = "5.13.0"

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
# fastembed 5.14+ pins ONNX Runtime API 24, but upstream ONNX Runtime 1.24
# no longer ships macOS x86_64 binaries. Stay on API 23 for Intel until the
# upstream binary set comes back or we replace the backend.
fastembed = { version = ">=5.13.0, <5.14.0", default-features = false, features = [
  "hf-hub-native-tls",
  "image-models",
  "ort-load-dynamic",
] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "ndarray",
  "std",
  "load-dynamic",
] }

# Mobile-only capabilities (Plan 19): the first-party keyboard bridge and
# haptics plugins; desktop has no software keyboard and no haptic engine.
# Sharing uses the webview's Web Share API, `navigator.share`, so it needs
# no native plugin.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-keyboard = { path = "../../../plugins/tauri-plugin-keyboard" }
tauri-plugin-mobile-haptics = { path = "../../../plugins/tauri-plugin-mobile-haptics" }
tauri-plugin-recording = { path = "../../../plugins/tauri-plugin-recording" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
# Proves the assembled Qwen tokenizer.json loads (`local_transcription/qwen.rs`).
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
