name: CI

on:
  push:
    # master is the only long-lived branch.
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test-chromium:
    if: github.event_name != 'merge_group'
    # The fork's suite is too large for one browser session; shard it.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    name: test-chromium ${{ matrix.shard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop exec playwright install chromium

      - name: Test
        run: pnpm run test --shard ${{ matrix.shard }}
        env:
          REFLECT_TEST_BROWSER: chromium
          # Chromium on Linux does not promptly free the iframe of a finished
          # test file (https://issues.chromium.org/issues/530892387), so one
          # browser process grows by 10 to 30 MB per file and dies near 2.5 GB,
          # which Vitest reports as "Browser connection was closed". Vitest can
          # collect garbage after each file, but only when the temp disk has
          # less free space than this threshold; an unreachable threshold makes
          # it collect every time (about 60 ms per file).
          # Vitest reads this variable: https://github.com/vitest-dev/vitest/blob/33cadea62e8763c455c7fca38d9ab1dda87c5f75/packages/vitest/src/node/pools/browser.ts#L510-L516
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '100000'

  # Not part of `all-green`: a WebKit failure does not block merging.
  test-webkit:
    if: github.event_name != 'merge_group'
    # The fork's suite is too large for one browser session; shard it.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    name: test-webkit ${{ matrix.shard }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop exec playwright install webkit

      - name: Test
        run: pnpm run test --shard ${{ matrix.shard }}
        env:
          REFLECT_TEST_BROWSER: webkit

  rust-lint:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Test
        run: cargo test --workspace

  # check Apple Rust bindings
  apple-lint:
    if: github.event_name != 'merge_group'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Check desktop library
        run: cargo check -p reflect-open --lib

      # PDF embeds render through CoreGraphics (Plan 25), so their rendering
      # tests only exist on macOS; ubuntu's `cargo test --workspace` runs the
      # platform-neutral rest.
      - name: Test PDF rendering
        run: cargo test -p reflect-open --lib pdf

      # The TestFlight workflow is the only full iOS build and it never runs on
      # pull requests, so type-check the iOS target here with the same feature
      # set `tauri ios` builds with.
      - name: Check iOS library
        run: cargo check -p reflect-open --lib --target aarch64-apple-ios --no-default-features

  # A single job for branch protection to require, instead of listing every
  # job as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs: [node-lint, test-chromium, rust-lint, rust-test, apple-lint]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (contains(needs.*.result, 'skipped') && github.event_name != 'merge_group') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
