packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@post-embed/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list

patchedDependencies:
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch

# Keep these commented examples for future pkg.pr.new testing; do not remove them.
# blockExoticSubdeps: false
# overrides:
#   '@meowdown/core': https://pkg.pr.new/@meowdown/core@346867e5f1b5336c889e829b146a04fcc0c115c1
#   '@meowdown/react': https://pkg.pr.new/@meowdown/react@346867e5f1b5336c889e829b146a04fcc0c115c1
#   '@meowdown/markdown': https://pkg.pr.new/@meowdown/markdown@346867e5f1b5336c889e829b146a04fcc0c115c1

# Plan 25: Reflect runs the Meowdown fork (mhxie/meowdown, branch
# master) from tarballs vendored by
# apps/desktop/scripts/vendor-meowdown.mjs; rerun it after changing the fork.
overrides:
  '@meowdown/markdown': file:vendor/meowdown/meowdown-markdown-0.77.0-a0b7cb52de45.tgz
  '@meowdown/core': file:vendor/meowdown/meowdown-core-0.81.2-a0b7cb52de45.tgz
  '@meowdown/react': file:vendor/meowdown/meowdown-react-0.81.1-a0b7cb52de45.tgz
